<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Молодёжная среда V2</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  /* Всё, что в этом <style> — забота ХОСТ-страницы (Tilda-блока), а не
     модуля: контейнер должен занимать всё доступное пространство блока,
     в котором он размещён. app.css модуля намеренно не знает о 100vh. */
  html, body { margin: 0; padding: 0; height: 100%; }
  #youth-hackathon-app {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>

<div id="youth-hackathon-app"></div>

<script src="../config/links.js"></script>
<script src="../config/scenes.js"></script>
<script src="../config/ui-strings.js"></script>
<script src="../config/objects.js"></script>
<script src="../config/zone-00-content.js"></script>
<script src="../config/zone-01-content.js"></script>
<script src="../config/zone-02-content.js"></script>
<script src="../config/zone-03-content.js"></script>
<script src="../config/zone-04-content.js"></script>
<script src="../config/zone-05-content.js"></script>
<script src="../config/zone-06-content.js"></script>
<script src="../config/zone-07-content.js"></script>
<script src="../core/scene-engine.js"></script>
<script src="../core/gesture-controller.js"></script>
<script src="../core/global-nav.js"></script>
<script src="../core/map-navigation.js"></script>
<script src="../core/debug-overlay.js"></script>
<script src="../core/hotspot-layer.js"></script>
<script src="../core/zone-00-bubbles.js"></script>
<script src="../core/zone-00-map.js"></script>
<script src="../core/zone-01-hall.js"></script>
<script src="../core/zone-hotspot-scene.js"></script>
<script src="../core/spatial-annotations.js"></script>
<script src="../core/zone-02-workshop.js"></script>
<script src="../core/zone-03-workshop.js"></script>
<script src="../core/zone-04-archive.js"></script>
<script src="../core/zone-05-gallery.js"></script>
<script src="../core/zone-06-team.js"></script>
<script src="../core/zone-07-cta.js"></script>
<script src="../core/mount.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var root = document.getElementById('youth-hackathon-app');

    var config = {
      scenes: window.YHApp.SCENES_CONFIG,
      links: window.YHApp.LINKS,
      uiStrings: window.YHApp.UI_STRINGS,
      objects: window.YHApp.OBJECTS,
      debug: params.get('debug') === '1',
      initialZone: params.get('zone')
    };

    window.YHApp.mount(root, config);
  })();
</script>
</body>
</html>
