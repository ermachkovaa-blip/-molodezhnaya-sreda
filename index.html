<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="page-title">Молодёжная среда</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= HEADER (глобальный, поверх карты и сцен) ================= -->
<header class="site-header" id="site-header">
  <a class="site-header__logo" href="index.html" id="site-logo-link">
    <img class="logo-mark" id="logo-image" src="" alt="">
    <span class="logo-caption" id="logo-caption"></span>
  </a>

  <nav class="site-header__nav" id="site-nav" aria-label="Основная навигация">
    <!-- пункты рендерятся из HEADER_NAV в main.js -->
  </nav>

  <div class="site-header__actions">
    <a class="cta-apply" id="cta-apply-header" href="#"></a>
    <button class="burger" id="burger-btn" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<nav class="mobile-menu" id="mobile-menu" aria-label="Мобильное меню" hidden>
  <!-- пункты рендерятся из HEADER_NAV в main.js -->
</nav>

<!-- ================= СТАРТОВАЯ КАРТА ПРОСТРАНСТВА (навигационный хаб, вне нумерации 00–07) ================= -->
<section id="map-view" class="view view--active" aria-label="Карта пространства">
  <!-- краткое интро — только на mobile, чтобы сразу было понятно, что это за сайт -->
  <div class="map-intro" id="map-intro">
    <p class="map-intro__title" id="map-intro-title"></p>
    <p class="map-intro__body" id="map-intro-body"></p>
  </div>

  <!-- mobile-only: заголовок первого экрана — настоящий HTML-текст, не
       часть картинки (см. renderBranding()/showMapHero() в main.js) -->
  <div class="map-hero" id="map-hero">
    <p class="map-hero__name" id="map-hero-name"></p>
    <p class="map-hero__tagline" id="map-hero-tagline"></p>
    <p class="map-hero__type" id="map-hero-type"></p>
  </div>

  <div class="map-stage">
    <picture>
      <source type="image/webp" id="map-source-webp" srcset="" sizes="100vw">
      <img class="map-image" id="map-image" src="assets/scenes/scene-map.png" srcset="" sizes="100vw" alt="" draggable="false">
    </picture>
    <div class="map-hotspots" id="map-hotspots"></div>
  </div>

  <!-- mobile-only: инструкция под картой — код, не часть картинки -->
  <div class="map-howto" id="map-howto">
    <p class="map-howto__title" id="map-howto-title"></p>
    <div class="map-howto__steps" id="map-howto-steps"></div>
  </div>

  <!-- mobile-only: компактная подсказка входа в пространство (зона 00) -->
  <button class="map-enter-hint" id="map-enter-hint" type="button">
    <span id="map-enter-hint-label"></span>
    <span aria-hidden="true">&#8595;</span>
  </button>

  <div class="map-zoom-veil" id="map-zoom-veil"></div>
</section>

<!-- ================= ПАНОРАМНЫЕ СЦЕНЫ 00–07 ================= -->
<section id="scene-view" class="view" aria-label="Сцена пространства">
  <div class="scene-viewport" id="scene-viewport">
    <div class="scene-stage" id="scene-stage">
      <picture>
        <source type="image/webp" id="scene-source-webp" srcset="" sizes="100vw">
        <img class="scene-image" id="scene-image" src="" srcset="" sizes="100vw" alt="" draggable="false">
      </picture>
      <div class="scene-hotspots" id="scene-hotspots"></div>
      <div class="scene-hotspots scene-hotspots--content" id="scene-content-hotspots"></div>
    </div>
  </div>

  <!-- 07 АМФИТЕАТР: постоянная CTA-карточка с достоверными датами (не встроена в pan/zoom canvas — всегда читаема) -->
  <aside class="cta-card" id="cta-card-07" hidden>
    <p class="cta-card__eyebrow" id="cta-card-eyebrow"></p>
    <p class="cta-card__title" id="cta-card-title"></p>
    <dl class="cta-card__dates">
      <div><dt id="cta-date-event-label"></dt><dd id="cta-date-event"></dd></div>
      <div><dt id="cta-date-apply-label"></dt><dd id="cta-date-apply"></dd></div>
      <div><dt id="cta-date-results-label"></dt><dd id="cta-date-results"></dd></div>
    </dl>
    <p class="cta-card__note" id="cta-card-note"></p>
    <a class="cta-card__button" id="cta-apply-scene" href="#"></a>
    <div class="cta-card__organizers" id="cta-card-organizers"></div>
  </aside>

  <div class="scene-topbar">
    <button class="map-return" id="map-return" aria-label="Вернуться к карте пространства (клавиша M)" title="Карта пространства (M)">
      <span id="map-return-label"></span>
      <span class="map-return__icon" aria-hidden="true">&#8593;</span>
    </button>
  </div>

  <!-- текущая зона + переход к следующей, всегда на экране -->
  <button class="scene-next" id="scene-next-btn" type="button">
    <span class="scene-next__current" id="scene-next-current"></span>
    <span class="scene-next__divider" aria-hidden="true">|</span>
    <span class="scene-next__label" id="scene-next-label"></span>
    <span class="scene-next__arrow" aria-hidden="true">&#8594;</span>
  </button>
</section>

<!-- ================= НИЖНЯЯ НАВИГАЦИЯ 00–07 =================
     Глобальный элемент (не внутри #scene-view): всегда видна в сценах,
     и на mobile — также поверх стартовой карты (см. showMapBottomNav()
     в main.js), чтобы по зонам можно было ходить прямо с главного экрана. -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Навигация по зонам пространства" hidden>
  <button class="bottom-nav__arrow" id="bottom-nav-prev" type="button" aria-label="Предыдущая зона">&#8592;</button>
  <div class="bottom-nav__rail" id="bottom-nav-rail"></div>
  <button class="bottom-nav__arrow" id="bottom-nav-next" type="button" aria-label="Следующая зона">&#8594;</button>
  <button class="bottom-nav__map" id="bottom-nav-map" type="button" aria-label="Карта пространства (клавиша M)" title="Карта пространства (M)">&#8593;</button>
</nav>

<!-- ================= ГЛОБАЛЬНЫЕ OVERLAY-Ы ================= -->

<!-- бумажная заметка / калька — переиспользуется для 02 и 03 -->
<div class="overlay-backdrop" id="paper-overlay" hidden>
  <div class="paper-note" role="dialog" aria-modal="true" aria-labelledby="paper-note-title">
    <button class="paper-note__close" id="paper-note-close" type="button" aria-label="Закрыть">&times;</button>
    <p class="paper-note__eyebrow" id="paper-note-subtitle"></p>
    <h3 class="paper-note__title" id="paper-note-title"></h3>
    <p class="paper-note__body" id="paper-note-body"></p>
  </div>
</div>

<!-- архивное досье — 04 -->
<div class="overlay-backdrop" id="dossier-overlay" hidden>
  <div class="dossier" role="dialog" aria-modal="true" aria-labelledby="dossier-title">
    <button class="dossier__close" id="dossier-close" type="button" aria-label="Закрыть">&times;</button>
    <p class="dossier__num" id="dossier-num"></p>
    <h3 class="dossier__title" id="dossier-title"></h3>
    <ul class="dossier__checklist" id="dossier-checklist"></ul>
    <p class="dossier__placeholder" id="dossier-placeholder"></p>
  </div>
</div>

<!-- popover роли команды — 06 -->
<div class="role-popover" id="role-popover" hidden role="dialog" aria-modal="false" aria-labelledby="role-popover-title">
  <p class="role-popover__title" id="role-popover-title"></p>
  <p class="role-popover__desc" id="role-popover-desc"></p>
</div>

<!-- лёгкий toast для случаев "ссылка ещё не подключена" и т.п. -->
<div class="toast" id="toast" hidden></div>

<!-- курсор-подсказка (десктоп): ИДТИ → / ПЕРЕТАЩИТЬ ↔ / ОТКРЫТЬ + / ПЕРЕЙТИ ↗ -->
<div class="cursor-badge" id="cursor-badge" hidden><span id="cursor-badge-text"></span></div>

<div class="fade-veil" id="fade-veil"></div>

<!-- debug HUD (?debug=1) -->
<div class="debug-hud" id="debug-hud" hidden></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
